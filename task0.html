    <div class="container">
      <a class="navbar-brand gh-brand" href="index.html">GameHub</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto"><li class="nav-item"><a class="nav-link" href="index.html">Home</a></li><li class="nav-item"><a class="nav-link active" href="task0.html" aria-current="page">Task 0</a></li><li class="nav-item"><a class="nav-link" href="task1.html">Task 1</a></li><li class="nav-item"><a class="nav-link" href="task2.html">Task 2</a></li><li class="nav-item"><a class="nav-link" href="task3.html">Task 3</a></li><li class="nav-item"><a class="nav-link" href="task4.html">Task 4</a></li></ul>

  <main class="container py-5">

    <h1 class="mb-1">Task 0. Simple contact form</h1>
    <p class="text-secondary mb-4">A basic HTML form with a label for every field. No validation here: that comes in Task 1.</p>
    <form action="#" method="post" class="plain-form" id="plainForm">
      <p>
        <label for="name">Name</label>
        <input type="text" id="name" name="name">
      </p>
      <p>
        <label for="email">Email</label>
        <input type="email" id="email" name="email">
      </p>
      <p>
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5"></textarea>
      </p>
      <button type="submit">Send message</button>
    </form>
    <div id="result" class="mt-3" role="status"></div>
  </main>
  <footer class="gh-footer py-4 mt-5">
    <div class="container small">Assignment #4: Forms and Validation. Azat Zholdygali (Азат Жолдыгали), group SE-2526.</div>
